[[redirects]]
  from = "/forum-thread"
  to = "https://anilist.co/forum/thread/8228"

[[redirects]]
  from = "/delete-account"
  to = "https://anilist.co/settings/account"

[build]
command = """\
  curl -sfLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
  tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
  rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
  export PATH="${HOME}/.local/dart-sass:${PATH}" && \
  git config --global core.quotepath false && \
  hugo --gc --minify --baseURL $URL
"""

[build.environment]
  HUGO_VERSION = "0.169.0"
  DART_SASS_VERSION = "1.108.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
command = """\
  curl -sfLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
  tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
  rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
  export PATH="${HOME}/.local/dart-sass:${PATH}" && \
  git config --global core.quotepath false && \
  hugo --gc --minify --buildFuture --baseURL $DEPLOY_PRIME_URL
"""
