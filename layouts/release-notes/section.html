{{ define "head" }}
  {{ $style := partial "sass.html" "scss/section.scss" }}
  <link rel="stylesheet" href="{{ $style.Permalink }}">
{{ end }}

{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <ul>
  {{ range .Pages }}
      <li>
        <a href="{{ .Permalink }}">{{.Title}}</a> &ndash; {{ .Date.Format "January 2, 2006"}}
      </li>
  {{ end }}
  </ul>
{{ end }}
